name: Scheduled DB Backup

on:
  schedule:
    # daily at 19:00 Vietnam time (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker --version

      - name: Check MONGO_URI secret
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          if [ -z "${MONGO_URI}" ]; then
            echo "ERROR: Repository secret MONGO_URI is not set or empty. Set it in Settings → Secrets & variables → Actions."
            exit 1
          fi
          echo "MONGO_URI appears set (showing prefix): ${MONGO_URI:0:30}..."

      - name: Run mongodump inside mongo container
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          set -eux
          ts=$(date -u +"%Y%m%d-%H%M%S")
          mkdir -p "$RUNNER_TEMP"
          echo "Using MONGO_URI: ${MONGO_URI:0:30}..."
          docker run --rm -v "$RUNNER_TEMP":/backup -e MONGO_URI="$MONGO_URI" mongo:6.0 bash -lc \
            "set -eux; mongodump --uri=\"$MONGO_URI\" --archive=/backup/db-$ts.archive.gz --gzip; ls -la /backup || true"
          echo "Backup (expected) location: $RUNNER_TEMP/db-$ts.archive.gz"

      - name: List runner temp files (debug)
        run: |
          echo "Listing files in RUNNER_TEMP: $RUNNER_TEMP"
          ls -la "$RUNNER_TEMP" || true

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}-${{ github.run_number }}
          path: ${{ runner.temp }}/db-*.archive.gz

      - name: Done
        run: echo "Backup workflow finished"
